# Service settings. The scheduler runs inside `curator serve` and sleeps between runs,
# so the service uses CPU only while a job runs.
schedule:
  timezone: America/Denver
  misfire_grace_seconds: 3600
  jobs:
    # Overnight: collect, score with the local model while the EVO-X2 is idle, pick, report.
    - {job: run, cron: "30 1 * * *"}
    # Weekly: search Apple Podcasts for new shows, then check suggested feeds (podcast_discovery
    # and feed_discovery in interests.yaml).
    - {job: discover, cron: "0 1 * * sun"}
    # Daytime: apply the tags you put on picks (follow, unfollow, read, meh) and record deleted
    # picks, so a tagged pick leaves "AI picks" within half an hour. No model; a few API calls.
    - {job: feedback, cron: "*/30 6-23 * * *"}
    # Optional daytime collection, for feeds that publish more than 50 items a day.
    # - {job: collect, cron: "0 13 * * *"}

# Publishing the picks to Raindrop.io (needs CURATOR_RAINDROP_TOKEN in .env).
# Off: every scheduled run is a dry run that only writes the report.
# `curator curate --publish` or `--dry-run` overrides this for one run.
publish:
  enabled: false
  collection: AI picks
  # Save links here from the share sheet or extension; each is scored overnight and moved into
  # `collection` with the curator's take. Empty turns it off.
  inbox_collection: To curate
  icon: sparkle
  # Tag a pick with these in Raindrop to follow or drop its source; read on every collect and
  # every feedback run.
  follow_tag: follow
  unfollow_tag: unfollow
  # Tag a pick `read` when done, `meh` for less like this; it moves out of `collection`.
  # Deleting a pick counts as a light negative. Empty turns a tag off.
  read_tag: read
  meh_tag: meh
  read_collection: AI read
  skipped_collection: AI skipped
