[project]
name = "content-curator"
version = "0.1.0"
description = "Self-hosted content curator: collects feeds, scores items with a local model, and picks a small daily reading queue."
readme = "README.md"
authors = [
    { name = "warroyo", email = "warroyo7199008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "uvicorn>=0.30",
]

[project.scripts]
curator = "content_curator.cli:main"
curator-healthcheck = "content_curator.healthcheck:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:To avoid breaking existing software:DeprecationWarning:feedparser"]
